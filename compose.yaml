services:
  mcp:
    image: mcp-carto:main
    container_name: mcp-carto
    build:
      context: .
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    environment:
      - HTTP_PORT=${HTTP_PORT:-3001}
      - HTTP_MCP_ENDPOINT=${HTTP_MCP_ENDPOINT:-/mcp}
      - CSP_CONNECT_DOMAINS=${CSP_CONNECT_DOMAINS:-}
    read_only: true
    ports:
      - "${HTTP_PORT:-3001}:${HTTP_PORT:-3001}"
    restart: unless-stopped


